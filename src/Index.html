<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --surface-2: #f7f9fa;
    --border: #e2e6ea;
    --border-strong: #cdd4db;
    --text: #16202a;
    --text-2: #43505c;
    --muted: #697684;
    --accent: #0f766e;
    --accent-hover: #0d625c;
    --accent-soft: #e3f3f1;
    --on-accent: #ffffff;
    --ok: #177a3c;
    --ok-soft: #e4f5ea;
    --low: #a95306;
    --low-soft: #fdf0d9;
    --out: #b42318;
    --out-soft: #fde8e6;
    --ordered: #2952cc;
    --ordered-soft: #e6ecfc;
    --scrim: rgba(15, 23, 42, 0.46);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.07);
    --shadow-lg: 0 18px 40px rgba(16, 24, 40, 0.2);
    --radius: 12px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1318;
      --surface: #161c23;
      --surface-2: #1b222a;
      --border: #28313b;
      --border-strong: #36414d;
      --text: #e7ecf1;
      --text-2: #b8c2cc;
      --muted: #8d99a6;
      --accent: #2eb3a3;
      --accent-hover: #43c3b3;
      --accent-soft: #113833;
      --on-accent: #04201c;
      --ok: #5ad48a;
      --ok-soft: #133021;
      --low: #f3b04c;
      --low-soft: #3a2a11;
      --out: #f7837a;
      --out-soft: #3c1a18;
      --ordered: #86a6ff;
      --ordered-soft: #1a2750;
      --scrim: rgba(0, 0, 0, 0.6);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }
  /* An explicit theme choice (data-theme) wins over the system setting either way. */
  :root[data-theme="dark"] {
    --bg: #0e1318;
    --surface: #161c23;
    --surface-2: #1b222a;
    --border: #28313b;
    --border-strong: #36414d;
    --text: #e7ecf1;
    --text-2: #b8c2cc;
    --muted: #8d99a6;
    --accent: #2eb3a3;
    --accent-hover: #43c3b3;
    --accent-soft: #113833;
    --on-accent: #04201c;
    --ok: #5ad48a;
    --ok-soft: #133021;
    --low: #f3b04c;
    --low-soft: #3a2a11;
    --out: #f7837a;
    --out-soft: #3c1a18;
    --ordered: #86a6ff;
    --ordered-soft: #1a2750;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { flex: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand actions" "tabs tabs";
    align-items: center; gap: 2px 12px; padding: 10px 16px 0;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { grid-area: brand; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 32px; height: 32px; border-radius: 9px; flex: none;
    display: grid; place-items: center; background: var(--accent); color: var(--on-accent);
  }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { grid-area: actions; display: flex; gap: 8px; align-items: center; }
  .tabs { grid-area: tabs; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
  .tab {
    border: 0; background: none; cursor: pointer; white-space: nowrap;
    padding: 10px 12px 9px; border-bottom: 2px solid transparent;
    color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  @media (min-width: 760px) {
    .topbar { grid-template-columns: auto 1fr auto; grid-template-areas: "brand tabs actions"; height: 62px; padding: 0 24px; gap: 24px; }
    .tabs { align-self: stretch; margin: 0; }
    .tab { padding: 0 12px; }
  }

  main { max-width: 1140px; margin: 0 auto; padding: 16px 16px 96px; }
  @media (min-width: 760px) { main { padding: 24px 24px 80px; } }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 40px; padding: 0 14px; border-radius: 9px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
    font-weight: 600; text-decoration: none; transition: background 0.12s, border-color 0.12s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.subtle { border-color: transparent; background: transparent; color: var(--text-2); }
  .btn.subtle:hover { background: var(--surface-2); }
  .btn.danger { color: var(--out); }
  .btn.danger-fill { background: var(--out); border-color: var(--out); color: #fff; }
  .btn.small { min-height: 32px; padding: 0 10px; font-size: 14px; border-radius: 8px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .icon-btn {
    width: 40px; height: 40px; flex: none; display: inline-grid; place-items: center; cursor: pointer;
    border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    text-decoration: none;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .spin svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 420px) { .hide-narrow { display: none; } #add-btn { padding: 0 11px; } }
  @media (max-width: 440px) { .tab svg { display: none; } .tab { padding: 10px 10px 9px; } }
  @media (max-width: 360px) { .brand .logo { display: none; } }

  /* ---------- Banners ---------- */
  .banner {
    display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; margin-bottom: 12px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 14px;
  }
  .banner.warn { background: var(--low-soft); border-color: transparent; }
  .banner.warn > svg { color: var(--low); }
  .banner.error { background: var(--out-soft); border-color: transparent; }
  .banner.error > svg { color: var(--out); }
  .banner.info > svg { color: var(--accent); }
  .banner .grow { flex: 1; min-width: 0; }
  .banner .banner-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .banner .close { background: none; border: 0; padding: 2px; cursor: pointer; color: var(--muted); }

  /* ---------- Filters ---------- */
  .filters { display: flex; gap: 8px; margin: 0 -1px 12px; padding: 1px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter {
    flex: none; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 8px 0 14px;
    border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-2); font-weight: 650; cursor: pointer; white-space: nowrap;
  }
  .filter:hover { border-color: var(--muted); color: var(--text); }
  .filter .count {
    min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; display: inline-grid; place-items: center;
    background: var(--surface-2); color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .filter.low.has .count { background: var(--low-soft); color: var(--low); }
  .filter.out.has .count { background: var(--out-soft); color: var(--out); }
  .filter.ordered.has .count { background: var(--ordered-soft); color: var(--ordered); }
  .filter[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
  .filter[aria-pressed="true"] .count { background: var(--surface); color: var(--text); }
  .filter .short { display: none; }
  @media (max-width: 520px) {
    .filters { gap: 6px; }
    .filter { padding: 0 5px 0 10px; gap: 5px; font-size: 14px; height: 36px; }
    .filter .count { min-width: 22px; height: 22px; padding: 0 6px; font-size: 12.5px; }
    .filter .long { display: none; }
    .filter .short { display: inline; }
  }
  @media (max-width: 380px) {
    .filters { gap: 4px; }
    .filter { padding: 0 4px 0 9px; gap: 4px; font-size: 13.5px; }
    .filter .count { min-width: 20px; padding: 0 5px; }
  }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .search { position: relative; flex: 1 1 260px; display: flex; align-items: center; }
  .search > span[data-icon] { position: absolute; left: 12px; top: 0; bottom: 0; display: flex; align-items: center; color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 42px; padding: 0 12px 0 38px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: var(--surface);
  }
  .toolbar select {
    height: 42px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface);
    padding: 0 10px; flex: 1 1 140px; max-width: 220px; min-width: 0;
  }
  @media (max-width: 520px) { .toolbar select { max-width: none; } }

  /* ---------- Parts list ---------- */
  .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .list-head { display: none; }
  .row {
    position: relative; display: grid; gap: 8px 12px; padding: 12px 14px 12px 18px;
    grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "main main" "extra stock";
    border-top: 1px solid var(--border);
  }
  .row:first-child { border-top: 0; }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .row.status-low::before { background: var(--low); }
  .row.status-out::before { background: var(--out); }
  .row.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
  .row-main { grid-area: main; min-width: 0; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
  .row-main:hover .name { text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .row-title { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
  .row-title .name { font-weight: 650; overflow-wrap: anywhere; }
  .row-meta { margin-top: 2px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .row-loc { display: none; }
  .row-extra { grid-area: extra; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; min-width: 0; }
  .row-min { display: none; }
  .row-act:empty { display: none; }
  .row-act .btn { min-height: 34px; padding: 0 12px; }
  .row-act .on-order { display: inline-flex; align-items: center; gap: 5px; color: var(--ordered); font-size: 13px; font-weight: 650; }
  .row-stock { grid-area: stock; justify-self: end; align-self: center; }
  @media (min-width: 760px) {
    .list-head, .row {
      grid-template-columns: minmax(0, 1fr) minmax(90px, 150px) 64px 186px 124px;
      grid-template-areas: "main loc min stock act";
    }
    .list-head {
      display: grid; gap: 12px; padding: 10px 16px 10px 20px; background: var(--surface-2);
      border-bottom: 1px solid var(--border); color: var(--muted);
      font-size: 12px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .list-head .right { text-align: right; }
    .row { align-items: center; padding: 10px 16px 10px 20px; }
    .row-extra { display: contents; }
    .row-min { display: block; grid-area: min; color: var(--text-2); font-size: 14px; font-variant-numeric: tabular-nums; }
    .meta-min { display: none; }
    .row-act, .row-act:empty { display: block; grid-area: act; justify-self: end; }
    .row-loc { display: block; grid-area: loc; color: var(--text-2); font-size: 14px; overflow-wrap: anywhere; }
    .meta-loc { display: none; }
  }

  .stepper {
    display: inline-flex; align-items: stretch; overflow: hidden;
    border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface);
  }
  .step {
    width: 42px; height: 42px; border: 0; background: var(--surface-2); color: var(--text-2);
    display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
  }
  .step:hover { color: var(--text); background: var(--border); }
  .step:disabled { opacity: 0.4; cursor: default; background: var(--surface-2); }
  .qty {
    min-width: 88px; padding: 0 6px; display: flex; align-items: baseline; justify-content: center; gap: 4px;
    align-self: center; font-variant-numeric: tabular-nums; position: relative;
  }
  .qty strong { font-size: 17px; }
  .qty small { color: var(--muted); font-size: 12px; }
  .qty.saving strong { opacity: 0.55; }
  .qty.saving::after {
    content: ""; position: absolute; right: 5px; top: 50%; width: 6px; height: 6px; margin-top: -3px;
    border-radius: 50%; background: var(--accent); animation: pulse 0.9s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.25; } to { opacity: 1; } }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 700; line-height: 20px; white-space: nowrap;
  }
  .badge.low { background: var(--low-soft); color: var(--low); }
  .badge.out { background: var(--out-soft); color: var(--out); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.ordered { background: var(--ordered-soft); color: var(--ordered); }

  .more { display: flex; justify-content: center; padding: 14px; border-top: 1px solid var(--border); }
  .empty { padding: 44px 20px; text-align: center; color: var(--muted); }
  .empty .empty-icon {
    width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 14px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .empty h3 { margin: 0 0 4px; color: var(--text); font-size: 17px; }
  .empty p { margin: 0 auto 16px; max-width: 420px; }

  .skeleton { padding: 16px 18px; border-top: 1px solid var(--border); display: grid; gap: 8px; }
  .skeleton:first-child { border-top: 0; }
  .bar { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- Part drawer ---------- */
  .drawer { position: fixed; inset: 0; z-index: 40; }
  .drawer-backdrop { position: absolute; inset: 0; background: var(--scrim); animation: fade 0.15s ease-out; }
  .drawer-panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(470px, 100%);
    display: flex; flex-direction: column; background: var(--surface); box-shadow: var(--shadow-lg);
    animation: slide-in 0.2s ease-out;
  }
  @keyframes fade { from { opacity: 0; } }
  @keyframes slide-in { from { transform: translateX(24px); opacity: 0.4; } }
  .drawer-head { display: flex; gap: 12px; align-items: flex-start; padding: 16px 16px 14px 20px; border-bottom: 1px solid var(--border); }
  .drawer-head .grow { flex: 1; min-width: 0; }
  .drawer-head h2 { margin: 2px 0 4px; font-size: 20px; line-height: 1.25; overflow-wrap: anywhere; }
  .eyebrow { color: var(--muted); font-size: 13px; font-weight: 600; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px 32px; display: grid; gap: 18px; align-content: start; }

  .stock-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); padding: 16px; display: grid; gap: 14px; }
  .stock-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .stock-big { font-size: 36px; font-weight: 750; line-height: 1; font-variant-numeric: tabular-nums; }
  .stock-big small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .stock-card.status-low .stock-big { color: var(--low); }
  .stock-card.status-out .stock-big { color: var(--out); }
  .stock-levels { color: var(--muted); font-size: 13px; text-align: right; }
  .segmented { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border-strong); border-radius: 9px; overflow: hidden; }
  .segmented button { border: 0; border-left: 1px solid var(--border-strong); background: var(--surface); padding: 8px 6px; font-weight: 600; cursor: pointer; }
  .segmented button:first-child { border-left: 0; }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .adjust-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
  .adjust-row input { height: 42px; border: 1px solid var(--border-strong); border-radius: 9px; padding: 0 12px; background: var(--surface); width: 100%; min-width: 0; }
  .adjust-preview { font-size: 13px; color: var(--muted); min-height: 19px; }

  .order-links { display: grid; gap: 8px; }
  .order-links a.btn { justify-content: space-between; }
  .order-links .btn span { overflow: hidden; text-overflow: ellipsis; }
  .ordered-note { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px; background: var(--ordered-soft); color: var(--ordered); font-weight: 600; font-size: 14px; }
  .ordered-note .grow { flex: 1; }

  .details { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 9px 12px; margin: 0; font-size: 14px; }
  .details dt { color: var(--muted); }
  .details dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 8px; }
  .drawer-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- Activity ---------- */
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .page-head h2 { margin: 0; font-size: 20px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .card-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .act { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-top: 1px solid var(--border); }
  .act:first-child { border-top: 0; }
  .act-icon { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
  .act.used .act-icon { background: var(--low-soft); color: var(--low); }
  .act.restocked .act-icon, .act.added .act-icon { background: var(--ok-soft); color: var(--ok); }
  .act.alert .act-icon { background: var(--accent-soft); color: var(--accent); }
  .act.deleted .act-icon { background: var(--out-soft); color: var(--out); }
  .act.ordered .act-icon { background: var(--ordered-soft); color: var(--ordered); }
  .act-line { overflow-wrap: anywhere; }
  .act-line a, .link-btn { color: var(--text); font-weight: 650; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .act-line a:hover, .link-btn:hover { text-decoration: underline; }
  .act-sub { color: var(--muted); font-size: 13px; margin-top: 1px; }
  .chg { font-weight: 700; font-variant-numeric: tabular-nums; }
  .chg.neg { color: var(--low); }
  .chg.pos { color: var(--ok); }
  .drawer .card-list { box-shadow: none; }

  /* ---------- Settings ---------- */
  .settings { display: grid; gap: 16px; max-width: 780px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
  .card h2 { margin: 0 0 2px; font-size: 17px; }
  .card .sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .card > :last-child { margin-bottom: 0; }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  .facts { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; color: var(--text-2); }
  .facts li { display: flex; gap: 8px; align-items: flex-start; }
  .facts svg { margin-top: 2px; color: var(--muted); }

  /* ---------- Forms ---------- */
  .form-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

    adjustMode: 'remove',
    activity: null,
    activityLimit: 100,
    activityLoadedAt: 0,
    partActivity: {},
    partActivityLoading: {},
    touched: {},
    deleted: {},
    adjustDraft: null,
    settingsDirty: false,
    code: store.get('code') || '',
    actor: store.get('actor') || '',
    loadedAt: 0,
    loading: false,
    pending: {},
    inflight: {},
    timers: {},
    editing: null,
    dismissed: {},
  };

  // -------------------------------------------------------------------------
  // Talking to the server (google.script.run)
  // -------------------------------------------------------------------------

  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('This page only works as a Google Apps Script web app.'));
        return;
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[fn]({ code: state.code, actor: state.actor }, ...args);
    });
  }

  function errorText(err) {
    const raw = (err && err.message) || String(err || '');
    if (/NetworkError|Failed to fetch|HTTP 0/i.test(raw)) return 'Couldn\'t reach Google. Check the connection and try again.';
    return raw.replace(/^(Exception|Error):\s*/i, '').replace(/^.*?ACCESS_(DENIED|LOCKED):\s*/, '') || 'Something went wrong.';
  }
  function isAccessError(err) { return /ACCESS_(DENIED|LOCKED)/.test((err && err.message) || String(err)); }

  function api(fn, ...args) {
    return call(fn, ...args).catch((err) => {
      if (isAccessError(err)) showLock(errorText(err), /ACCESS_LOCKED/.test((err && err.message) || String(err)));
      throw err;
    });
  }

  function load(options) {
    const opts = options || {};
    if (state.loading) return Promise.resolve();
    state.loading = true;
    const btn = $('#refresh-btn');
    btn.classList.add('spin');
    const requestedAt = Date.now();
    return api('apiGetData')
      .then((data) => {
        // Changes saved while this was loading are newer than what came back.
        const newer = (id) => state.touched[id] > requestedAt;
        const seen = {};
        data.parts = data.parts.filter((p) => !(state.deleted[p.id] > requestedAt)).map((p) => {
          seen[p.id] = true;
          return (newer(p.id) && partById(p.id)) || p;
        });
        state.parts.forEach((p) => { if (newer(p.id) && !seen[p.id]) data.parts.push(p); });
        applyData(data);
        if (opts.fromLock) store.set('code', state.code);
      })
      .catch((err) => {
        if (isAccessError(err)) return;
        if (!state.data) showFatal(errorText(err));
        else toast(errorText(err), 'error');
      })
      .then(() => {
        state.loading = false;
        btn.classList.remove('spin');
      });
  }

  function applyData(data) {
    state.data = data;
    state.parts = data.parts;
    state.loadedAt = Date.now();
    state.activity = null;
    state.partActivity = {};
    $('#screen').hidden = true;
    $('#app').hidden = false;
    $('#app-name').textContent = data.settings.appName;
    document.title = data.settings.appName;
    renderAll();
  }

  // -------------------------------------------------------------------------
  // Stock status (mirrors the server) and the numbers shown on screen
  // -------------------------------------------------------------------------

  function partById(id) { return state.parts.find((p) => p.id === id) || null; }
  function unsaved(id) { return (state.pending[id] || 0) + (state.inflight[id] || 0); }
  function qtyOf(p) {
    const d = unsaved(p.id);
    if (p.quantity === null && !d) return null;
    return round((p.quantity || 0) + d);
  }
  function statusOf(p) {
    const q = qtyOf(p);
    if (q !== null && q <= 0) return 'out';
    if (p.minQty !== null && q !== null && q <= p.minQty) return 'low';
    return 'ok';
  }

  function counts() {
    const c = { all: state.parts.length, low: 0, out: 0, ordered: 0 };
    state.parts.forEach((p) => {
      const s = statusOf(p);
      if (s !== 'ok') c.low++;
      if (s === 'out') c.out++;
      if (p.ordered) c.ordered++;
    });
    return c;
  }

  function visibleParts() {
    const terms = state.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const list = state.parts.filter((p) => {
      const s = statusOf(p);
      if (state.filter === 'low' && s === 'ok') return false;
      if (state.filter === 'out' && s !== 'out') return false;
      if (state.filter === 'ordered' && !p.ordered) return false;
      if (state.category && (p.category || '') !== state.category) return false;
      if (!terms.length) return true;
      const hay = [p.name, p.partNumber, p.id, p.category, p.location, p.supplier, p.notes].join(' ').toLowerCase();
      return terms.every((t) => hay.indexOf(t) !== -1);
    });
    const rank = { out: 0, low: 1, ok: 2 };
    const name = (p) => displayName(p);
    list.sort((a, b) => {
      if (state.sort === 'status') return rank[statusOf(a)] - rank[statusOf(b)] || byText(name(a), name(b));
      if (state.sort === 'qty') {
        const qa = qtyOf(a); const qb = qtyOf(b);
        return (qa === null ? Infinity : qa) - (qb === null ? Infinity : qb) || byText(name(a), name(b));
      }
      if (state.sort === 'location') return byText(a.location || '￿', b.location || '￿') || byText(name(a), name(b));
      if (state.sort === 'updated') return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')) || byText(name(a), name(b));
      return byText(name(a), name(b));
    });
    return list;
  }

  function uniqueValues(key) {
    const seen = {};
    state.parts.forEach((p) => { if (p[key]) seen[p[key]] = true; });
    return Object.keys(seen).sort(byText);
  }

  // -------------------------------------------------------------------------
  // Rendering
  // -------------------------------------------------------------------------

  function renderAll() {
    renderBanners();
    renderFilters();
    renderCategoryFilter();
    renderList();
    if (state.selectedId) renderDrawer();
    if (state.view === 'settings' && !state.settingsDirty) renderSettings();
    if (state.view === 'activity') showActivity();
  }

  function renderBanners() {
    const el = clear($('#banners'));
    const d = state.data;
    const owner = d.user.isOwner;
    const banner = (kind, iconName, key, body, actions) => h('div', { class: 'banner ' + kind, role: kind === 'error' ? 'alert' : null },
      icon(iconName, 20),
      h('div', { class: 'grow' }, body, actions && actions.length ? h('div', { class: 'banner-actions' }, actions) : null),
      key ? h('button', { class: 'close', type: 'button', 'aria-label': 'Dismiss', onclick: () => { state.dismissed[key] = true; renderBanners(); } }, icon('x', 16)) : null);

    if (!d.settings.recipients.length) {
      el.appendChild(banner('warn', 'mail', null,
        [h('b', {}, 'Nobody gets low-stock emails yet. '), owner ? 'Add an email address in Settings.' : 'Ask ' + (d.info.sender || 'the app owner') + ' to add one in Settings.'],
        owner ? [h('button', { class: 'btn small', type: 'button', onclick: () => { setView('settings'); focusLater('#s-recipients'); } }, 'Add email')] : null));
    }
    if (d.info.lastAlertError && !state.dismissed.alertError) {
      el.appendChild(banner('error', 'alert', 'alertError',
        [h('b', {}, 'The last low-stock email couldn\'t be sent. '), d.info.lastAlertError.message, ' (', timeAgo(d.info.lastAlertError.at), '). It will be retried every hour.']));
    }
    if (owner && !d.info.alertsInstalled && !state.dismissed.triggers) {
      el.appendChild(banner('warn', 'clock', 'triggers',
        [h('b', {}, 'Automatic checks are off. '), 'Emails still go out for changes made here, but not for edits made straight in the spreadsheet. To fix that, open the spreadsheet and choose Inventory > Set up / repair.']));
    }
    if (!d.user.email && !state.actor && !state.dismissed.name && BOOT.mode !== 'sidebar') {
      el.appendChild(banner('info', 'user', 'name',
        'Add your name so your changes show up under it in the activity log.',
        [h('button', { class: 'btn small', type: 'button', onclick: () => askName() }, 'Add my name')]));
    }
  }

  function renderFilters() {
    const c = counts();
    const el = clear($('#filters'));
    [
      { key: 'all', label: 'All parts', short: 'All', n: c.all },
      { key: 'low', label: 'Low stock', short: 'Low', n: c.low },
      { key: 'out', label: 'Out of stock', short: 'Out', n: c.out },
      { key: 'ordered', label: 'On order', short: 'Ordered', n: c.ordered },
    ].forEach((f) => {
      el.appendChild(h('button', {
        class: 'filter ' + f.key + (f.n > 0 ? ' has' : ''),
        type: 'button',
        'data-filter': f.key,
        'aria-pressed': String(state.filter === f.key),
        onclick: () => setFilter(state.filter === f.key && f.key !== 'all' ? 'all' : f.key),
      }, h('span', { class: 'long' }, f.label), h('span', { class: 'short' }, f.short), h('span', { class: 'count' }, fmt(f.n))));
    });
  }

  function renderCategoryFilter() {
    const select = $('#category-filter');
    const cats = uniqueValues('category');
    select.hidden = !state.data.fields.category || !cats.length;
    if (state.category && cats.indexOf(state.category) === -1) state.category = '';
    clear(select).appendChild(h('option', { value: '' }, 'All categories'));
    cats.forEach((c) => select.appendChild(h('option', { value: c, selected: c === state.category }, c)));
    $('#sort').value = state.sort;
  }

  function renderList() {
    const el = clear($('#list'));
    const parts = visibleParts();
    if (!state.parts.length) {
      el.appendChild(h('div', { class: 'empty' },
        h('div', { class: 'empty-icon' }, icon('box', 26)),
        h('h3', {}, 'No parts yet'),
        h('p', {}, 'Add your first part, with the link to reorder it and the quantity that should trigger a low-stock email. You can also type parts straight into the Inventory tab of the spreadsheet.'),
        h('button', { class: 'btn primary', type: 'button', onclick: () => openPartForm(null) }, icon('plus'), 'Add a part')));
      return;
    }
    if (!parts.length) {
      el.appendChild(h('div', { class: 'empty' },
        h('div', { class: 'empty-icon' }, icon('search', 24)),
        h('h3', {}, 'No parts match'),
        h('p', {}, state.filter === 'low' ? 'Nothing is low on stock right now.' : 'Try a different search or filter.'),
        h('button', { class: 'btn', type: 'button', onclick: resetFilters }, 'Show all parts')));
      return;
    }
    el.appendChild(h('div', { class: 'list-head', 'aria-hidden': 'true' },
      h('span', {}, 'Part'), h('span', {}, 'Location'), h('span', {}, 'Min'), h('span', { class: 'right' }, 'On hand'), h('span', {})));
    parts.slice(0, state.showCount).forEach((p) => el.appendChild(partRow(p)));
    if (parts.length > state.showCount) {
      el.appendChild(h('div', { class: 'more' },
        h('button', { class: 'btn', type: 'button', onclick: () => { state.showCount += 150; renderList(); } },
          'Show more (' + (parts.length - state.showCount) + ' more)')));
    }
  }

  function badges(p) {
    const s = statusOf(p);
    return [
      s === 'low' ? h('span', { class: 'badge low' }, 'Low') : null,
      s === 'out' ? h('span', { class: 'badge out' }, 'Out') : null,
      p.ordered ? h('span', { class: 'badge ordered' }, icon('truck', 13), 'On order') : null,
    ];
  }

  function partRow(p) {
    const s = statusOf(p);
    const q = qtyOf(p);
    const busy = unsaved(p.id) !== 0 || p.id in state.inflight;
    const link = safeUrl(p.links[0]);
    // Where to find it first; on wide screens the location has its own column.
    const meta = [
      p.location ? h('span', { class: 'meta-loc' }, p.location, p.partNumber || p.minQty !== null ? ' · ' : '') : null,
      p.partNumber ? h('span', {}, '#' + p.partNumber) : null,
      p.minQty !== null ? h('span', { class: 'meta-min' }, (p.partNumber ? ' · ' : '') + 'Min ' + fmt(p.minQty)) : null,
    ].filter(Boolean);
    let action = null;
    if (p.ordered) {
      action = h('span', { class: 'on-order' }, icon('truck', 15), 'On order');
    } else if (s !== 'ok' && link) {
      action = h('a', {
        class: 'btn small primary', href: link, target: '_blank', rel: 'noopener noreferrer',
        title: 'Opens ' + hostOf(link), onclick: () => offerMarkOrdered(p.id),
      }, icon('cart', 16), 'Reorder');
    }
    return h('div', { class: 'row status-' + s, 'data-id': p.id },
      h('button', { class: 'row-main', type: 'button', onclick: () => openPart(p.id) },
        h('span', { class: 'row-title' }, h('span', { class: 'name' }, displayName(p)), statusBadge(p)),
        meta.length ? h('span', { class: 'row-meta' }, meta) : null),
      h('div', { class: 'row-loc' }, p.location || h('span', { class: 'muted' }, '—')),
      h('div', { class: 'row-extra' },
        h('div', { class: 'row-act' }, action),
        h('div', { class: 'row-min' }, p.minQty !== null ? fmt(p.minQty) : h('span', { class: 'muted' }, '—'))),
      h('div', { class: 'row-stock' },
        h('div', { class: 'stepper' },
          h('button', {
            class: 'step', type: 'button', 'aria-label': 'Take one ' + displayName(p) + ' out',
            disabled: q === null || q < 1, onclick: () => quickAdjust(p.id, -1),
          }, icon('minus')),
          h('span', { class: 'qty' + (busy ? ' saving' : ''), 'aria-label': fmt(q) + ' on hand' },
            h('strong', {}, fmt(q)), p.unit ? h('small', {}, p.unit) : null),
          h('button', {
            class: 'step', type: 'button', 'aria-label': 'Put one ' + displayName(p) + ' back', onclick: () => quickAdjust(p.id, 1),
          }, icon('plus')))));
  }

  function statusBadge(p) {
    const s = statusOf(p);
    if (s === 'low') return h('span', { class: 'badge low' }, 'Low');
    if (s === 'out') return h('span', { class: 'badge out' }, 'Out');
    return null;
  }

  /** After Reorder opens the supplier's page, offer to mark the part as ordered. */
  function offerMarkOrdered(id) {
    setTimeout(() => {
      const p = partById(id);
      if (!p || p.ordered) return;
      toast('Placed the order for ' + displayName(p) + '?', 'cart', { label: 'Mark as ordered', run: () => setOrdered(id, true) });
    }, 400);
  }

  function updateRow(id) {
    const old = $('#list .row[data-id="' + CSS.escape(id) + '"]');
    const p = partById(id);
    if (old && p) old.replaceWith(partRow(p));
    renderFilters();
    if (state.selectedId === id) renderDrawer();
  }

  // -------------------------------------------------------------------------
  // Quick +/- buttons: taps are batched and sent once you stop tapping
  // -------------------------------------------------------------------------

  function quickAdjust(id, delta) {
    const p = partById(id);
    if (!p) return;
    if ((qtyOf(p) || 0) + delta < 0) return;
    state.pending[id] = round((state.pending[id] || 0) + delta);
    updateRow(id);
    clearTimeout(state.timers[id]);
    state.timers[id] = setTimeout(() => flushAdjust(id), 700);
  }

  function flushAdjust(id) {
    clearTimeout(state.timers[id]);
    if (id in state.inflight) {
      state.timers[id] = setTimeout(() => flushAdjust(id), 250);
      return;
    }
    const delta = state.pending[id] || 0;
    delete state.pending[id];
    if (!delta) { updateRow(id); return; }
    state.inflight[id] = delta;
    api('apiAdjustStock', { id: id, mode: delta > 0 ? 'add' : 'remove', amount: Math.abs(delta) })
      .then((res) => {
        delete state.inflight[id];
        replacePart(res.part);
        announceAlert(res.alert);
      })
      .catch((err) => {
        delete state.inflight[id];
        updateRow(id);
        if (!isAccessError(err)) toast(errorText(err), 'error');
      });
  }

  function flushAll() { Object.keys(state.pending).forEach(flushAdjust); }

  function replacePart(part) {
    state.touched[part.id] = Date.now();
    const i = state.parts.findIndex((p) => p.id === part.id);
    if (i === -1) state.parts.push(part);
    else state.parts[i] = part;
    delete state.partActivity[part.id];
    state.activity = null;
    updateRow(part.id);
  }

  function announceAlert(alert) {
    if (!alert) return;
    if (alert.sent) toast('Low-stock email sent to ' + alert.recipients.join(', ') + '.', 'mail');
    else if (alert.error) toast('Couldn\'t send the low-stock email: ' + alert.error, 'error');
    else if (alert.skipped) toast('This part is now low. No email was sent: ' + alert.skipped, 'alert');
  }

  // -------------------------------------------------------------------------
  // Part details drawer
  // -------------------------------------------------------------------------

  let drawerReturnFocus = null;

  function openPart(id) {
    const p = partById(id);
    if (!p) { toast('That part wasn\'t found. It may have been deleted.', 'error'); return; }
    if (state.selectedId !== id) state.adjustMode = statusOf(p) === 'out' ? 'add' : 'remove';
    drawerReturnFocus = document.activeElement;
    if (!state.selectedId) pushBackStop('part');
    state.selectedId = id;
    $('#drawer').hidden = false;
    document.body.style.overflow = 'hidden';
    renderDrawer();
    const close = $('#drawer-close');
    if (close) close.focus();
  }

  function closeDrawer(fromBackButton) {
    if (!state.selectedId) return;
    if (!fromBackButton) popBackStop('part');
    state.selectedId = null;
    $('#drawer').hidden = true;
    document.body.style.overflow = '';
    if (drawerReturnFocus && document.contains(drawerReturnFocus)) drawerReturnFocus.focus();
    // Refreshes are held while the panel is open; catch up now if it's been a while.
    if (state.data && Date.now() - state.loadedAt > 60000 && !busy()) load();
  }

  function renderDrawer() {
    const panel = clear($('#drawer-panel'));
    const p = partById(state.selectedId);
    if (!p) { closeDrawer(); return; }
    const s = statusOf(p);
    const q = qtyOf(p);
    const fields = state.data.fields;

    panel.appendChild(h('div', { class: 'drawer-head' },
      h('div', { class: 'grow' },
        h('div', { class: 'eyebrow' }, [p.id, p.category].filter(Boolean).join(' · ')),
        h('h2', { id: 'drawer-title' }, displayName(p)),
        h('div', { class: 'row-title' },
          s === 'ok' ? h('span', { class: 'badge ok' }, icon('check', 13), 'In stock') : null, badges(p),
          p.partNumber ? h('span', { class: 'muted' }, 'Part # ' + p.partNumber) : null)),
      h('button', { class: 'icon-btn', id: 'drawer-close', type: 'button', 'aria-label': 'Close', onclick: closeDrawer }, icon('x'))));

    const body = h('div', { class: 'drawer-body' });
    panel.appendChild(body);

    // Stock and adjusting it
    const draft = state.adjustDraft && state.adjustDraft.id === p.id ? state.adjustDraft : null;
    const amount = h('input', {
      id: 'adjust-amount', type: 'number', inputmode: 'decimal', min: '0', step: 'any', 'aria-label': 'Amount',
    });
    amount.value = draft && draft.mode === state.adjustMode ? draft.amount
      : state.adjustMode === 'set' ? (q === null ? '' : String(q)) : '1';
    const note = h('input', { id: 'adjust-note', type: 'text', maxlength: '300', placeholder: 'Note (optional), e.g. job or reason', 'aria-label': 'Note' });
    note.value = draft ? draft.note : '';
    const saveDraft = () => { state.adjustDraft = { id: p.id, mode: state.adjustMode, amount: amount.value, note: note.value }; };
    amount.addEventListener('input', saveDraft);
    note.addEventListener('input', saveDraft);
    const preview = h('div', { class: 'adjust-preview', 'aria-live': 'polite' });
    const apply = h('button', { class: 'btn primary block', type: 'submit' }, 'Apply');
    const updatePreview = () => {
      const n = Number(amount.value);
      const cur = q || 0;
      if (amount.value === '' || !(n >= 0)) { preview.textContent = ''; return; }
      const next = state.adjustMode === 'add' ? cur + n : state.adjustMode === 'remove' ? cur - n : n;
      preview.textContent = next < 0 ? 'Only ' + fmt(cur) + ' on hand.' : 'New quantity: ' + fmt(next) + (p.unit ? ' ' + p.unit : '') +
        (p.minQty !== null && next <= p.minQty && !(p.minQty !== null && cur <= p.minQty) ? ' (low: an email will go out)' : '');
    };
    amount.addEventListener('input', updatePreview);
    const modeButton = (mode, label) => h('button', {
      type: 'button', 'aria-pressed': String(state.adjustMode === mode),
      onclick: () => {
        if (state.adjustDraft && state.adjustDraft.id === p.id) state.adjustDraft.mode = null;
        state.adjustMode = mode;
        renderDrawer();
        focusLater('#adjust-amount', true);
      },
    }, label);
    const form = h('form', {
      class: 'form-grid', onsubmit: (e) => { e.preventDefault(); submitAdjust(p.id, amount.value, note.value, apply); },
    },
    h('div', { class: 'segmented', role: 'group', 'aria-label': 'Change type' },
      modeButton('remove', 'Use'), modeButton('add', 'Restock'), modeButton('set', 'Set count')),
    h('div', { class: 'adjust-row' }, amount, note), preview, apply);
    updatePreview();

    body.appendChild(h('div', { class: 'stock-card status-' + s },
      h('div', { class: 'stock-top' },
        h('div', {}, h('div', { class: 'eyebrow' }, 'On hand'), h('div', { class: 'stock-big' }, fmt(q), p.unit ? h('small', {}, p.unit) : null)),
        h('div', { class: 'stock-levels' },
          p.minQty !== null ? h('div', {}, 'Min ', h('b', {}, fmt(p.minQty)), ' (alert at or below)') : h('div', {}, 'No min set, so no alerts'),
          p.reorderQty !== null ? h('div', {}, 'Reorder ', h('b', {}, fmt(p.reorderQty))) : null)),
      form));

    // Ordering
    const links = p.links.map(safeUrl).filter(Boolean);
    const orderBox = h('div', { class: 'order-links' });
    links.forEach((url, i) => orderBox.appendChild(h('a', {
      class: 'btn' + (i === 0 ? ' primary' : ''), href: url, target: '_blank', rel: 'noopener noreferrer',
    }, h('span', {}, 'Order from ' + hostOf(url)), icon('external', 16))));
    if (!links.length) {
      orderBox.appendChild(h('button', { class: 'btn', type: 'button', onclick: () => openPartForm(p.id, 'f-link') }, icon('link', 16), 'Add an order link'));
    }
    if (p.ordered) {
      orderBox.appendChild(h('div', { class: 'ordered-note' }, icon('truck'),
        h('span', { class: 'grow' }, 'On order' + (p.orderedAt ? ' since ' + fmtDate(p.orderedAt) : '')),
        h('button', { class: 'btn small', type: 'button', onclick: (e) => setOrdered(p.id, false, e.currentTarget) }, 'Clear')));
    } else if (s !== 'ok') {
      orderBox.appendChild(h('button', { class: 'btn', type: 'button', onclick: (e) => setOrdered(p.id, true, e.currentTarget) },
        icon('check', 16), 'Mark as ordered'));
    }
    body.appendChild(h('section', {}, h('h3', { class: 'section-title' }, 'Reorder'), orderBox));

    // Details
    const dl = h('dl', { class: 'details' });
    const row = (label, value) => { if (value !== null && value !== undefined && value !== '') add(dl, [h('dt', {}, label), h('dd', {}, value)]); };
    if (fields.location) row('Location', p.location);
    if (fields.supplier) row('Supplier', p.supplier);
    if (fields.unitCost && p.unitCost !== null) row('Unit cost', fmtMoney(p.unitCost));
    if (fields.notes) row('Notes', p.notes);
    row('Last change', p.updatedAt ? fmtDate(p.updatedAt, true) + (p.updatedBy ? ' by ' + p.updatedBy : '') : '');
    if (p.alerted) row('Alert emailed', p.alertSentAt ? fmtDate(p.alertSentAt, true) : 'Yes');
    body.appendChild(h('section', {}, h('h3', { class: 'section-title' }, 'Details'), dl));

    body.appendChild(h('div', { class: 'drawer-actions' },
      h('button', { class: 'btn', type: 'button', onclick: () => openPartForm(p.id) }, icon('edit', 16), 'Edit'),
      h('button', { class: 'btn', type: 'button', onclick: () => copyPartLink(p) }, icon('copy', 16), 'Copy link'),
      h('button', { class: 'btn danger', type: 'button', onclick: () => deletePart(p) }, icon('trash', 16), 'Delete')));

    // Recent activity for this part
    const history = h('div', { id: 'part-history' });
    body.appendChild(h('section', {}, h('h3', { class: 'section-title' }, 'Recent activity'), history));
    renderPartActivity(p.id);
  }

  function submitAdjust(id, amountText, note, button) {
    const amount = Number(amountText);
    if (amountText === '' || !(amount >= 0)) { toast('Enter an amount.', 'error'); return; }
    if (state.adjustMode !== 'set' && amount === 0) { toast('Enter an amount greater than zero.', 'error'); return; }
    const mode = state.adjustMode;
    const p = partById(id);
    const before = qtyOf(p);
    button.disabled = true;
    api('apiAdjustStock', { id: id, mode: mode, amount: amount, note: note })
      .then((res) => {
        state.adjustDraft = null;
        replacePart(res.part);
        const verb = mode === 'add' ? 'Restocked ' + fmt(amount) : mode === 'remove' ? 'Used ' + fmt(amount) : 'Count set to ' + fmt(amount);
        toast(verb + ' · ' + fmt(res.part.quantity) + ' on hand' + (mode === 'set' && before !== null ? ' (was ' + fmt(before) + ')' : ''), 'check');
        announceAlert(res.alert);
      })
      .catch((err) => { if (!isAccessError(err)) toast(errorText(err), 'error'); })
      .then(() => { button.disabled = false; });
  }

  function setOrdered(id, ordered, button) {
    if (button) button.disabled = true;
    api('apiSetOrdered', id, ordered)
      .then((res) => {
        replacePart(res.part);
        toast(ordered ? 'Marked as ordered. Reminders skip it until it\'s restocked.' : 'Order mark cleared.', 'truck');
      })
      .catch((err) => { if (!isAccessError(err)) toast(errorText(err), 'error'); if (button) button.disabled = false; });
  }

  function loadPartActivity(id) {
    if (state.partActivityLoading[id]) return;
    state.partActivityLoading[id] = true;
    api('apiGetActivity', { partId: id, limit: 12 })
      .then((res) => { state.partActivity[id] = res.entries; }, () => { state.partActivity[id] = []; })
      .then(() => {
        delete state.partActivityLoading[id];
        if (state.selectedId === id) renderPartActivity(id);
      });
  }

  function renderPartActivity(id) {
    const el = $('#part-history');
    if (!el) return;
    clear(el);
    const entries = state.partActivity[id];
    if (!entries) {
      el.appendChild(h('div', { class: 'card-list' }, h('div', { class: 'skeleton' }, h('div', { class: 'bar', style: 'width:60%' }), h('div', { class: 'bar', style: 'width:35%' }))));
      loadPartActivity(id);
      return;
    }
    if (!entries.length) { el.appendChild(h('p', { class: 'muted' }, 'Nothing yet.')); return; }
    el.appendChild(h('ul', { class: 'timeline card-list' }, entries.map((e) => activityItem(e, false))));
  }

  function copyPartLink(p) {
    const base = state.data.settings.appUrl;
    if (!base) { toast('Add the web app link in Settings first (it ends in /exec).', 'info'); return; }
    const url = base + (base.indexOf('?') === -1 ? '?' : '&') + 'part=' + encodeURIComponent(p.id);
    copyText(url).then((ok) => toast(ok ? 'Link copied. It opens this part directly (handy for QR labels on bins).' : url, ok ? 'check' : 'link'));
  }

  function copyText(text) {
    const fallback = () => {
      const ta = h('textarea', { style: 'position:fixed;opacity:0;top:0;left:0' });
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove();
      return ok;
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(() => true, () => fallback());
    }
    return Promise.resolve(fallback());
  }

  function deletePart(p) {
    confirmDialog({
      title: 'Delete ' + displayName(p) + '?',
      message: 'This removes the part and its row from the spreadsheet. Its history stays in the Activity Log tab.',
      ok: 'Delete part',
      danger: true,
    }).then((yes) => {
      if (!yes) return;
      api('apiDeletePart', p.id)
        .then(() => {
          state.deleted[p.id] = Date.now();
          state.parts = state.parts.filter((x) => x.id !== p.id);
          state.activity = null;
          closeDrawer();
          renderAll();
          toast('Deleted ' + displayName(p) + '.', 'trash');
        })
        .catch((err) => { if (!isAccessError(err)) toast(errorText(err), 'error'); });
    });
  }

  // -------------------------------------------------------------------------
  // Add / edit form
  // -------------------------------------------------------------------------

  const FORM_FIELDS = ['name', 'partNumber', 'category', 'location', 'supplier', 'quantity', 'unit', 'minQty', 'reorderQty', 'unitCost', 'link', 'notes'];
  const NUMBER_FIELDS = ['quantity', 'minQty', 'reorderQty', 'unitCost'];

  function formValue(p, key) {
    if (!p) return key === 'quantity' ? '' : '';
    if (key === 'link') return p.links.length ? p.links.join('\n') : p.link;
    const v = p[key];
    return v === null || v === undefined ? '' : String(v);
  }

  function openPartForm(id, focusId) {
    const p = id ? partById(id) : null;
    state.editing = p ? p.id : null;
    const dialog = $('#part-dialog');
    const fields = state.data.fields;
    $('#part-dialog-title').textContent = p ? 'Edit ' + displayName(p) : 'Add part';
    $('#part-save').textContent = p ? 'Save changes' : 'Add part';
    $('#part-form-error').hidden = true;
    $('#dup-hint').hidden = true;
    $$('[data-field]', dialog).forEach((el) => { el.hidden = !fields[el.getAttribute('data-field')]; });
    FORM_FIELDS.forEach((key) => {
      const input = $('#f-' + key);
      input.value = formValue(p, key);
      input.removeAttribute('aria-invalid');
      input.dataset.original = input.value;
    });
    if (!p) $('#f-quantity').value = '0';
    ['category', 'location', 'supplier'].forEach((key) => fillDatalist('#dl-' + key, uniqueValues(key)));
    fillDatalist('#dl-unit', ['ea', 'pcs', 'box', 'pack', 'bag', 'roll', 'ft', 'm', 'lb', 'kg', 'gal', 'L'].concat(uniqueValues('unit')));
    if (!dialog.open) openDialog(dialog);
    focusLater('#' + (focusId || 'f-name'), true);
  }

  function fillDatalist(sel, values) {
    const seen = {};
    const el = clear($(sel));
    values.forEach((v) => { if (!seen[v]) { seen[v] = true; el.appendChild(h('option', { value: v })); } });
  }

  function checkDuplicate() {
    const value = $('#f-partNumber').value.trim().toLowerCase();
    const hint = $('#dup-hint');
    const other = value && state.parts.find((p) => p.id !== state.editing && (p.partNumber || '').toLowerCase() === value);
    hint.hidden = !other;
    if (other) hint.textContent = displayName(other) + ' (' + other.id + ') already has this part number.';
  }

  function submitPartForm(e) {
    e.preventDefault();
    const errorBox = $('#part-form-error');
    errorBox.hidden = true;
    const fields = state.data.fields;
    const isNew = !state.editing;
    const input = {};
    let problem = null;
    FORM_FIELDS.forEach((key) => {
      const el = $('#f-' + key);
      const container = el.closest('[data-field]');
      if (container && container.hidden) return;
      if (key === 'unit' && !fields.unit) return;
      el.removeAttribute('aria-invalid');
      const value = el.value.trim();
      if (NUMBER_FIELDS.indexOf(key) !== -1 && value !== '' && !(Number(value) >= 0)) {
        el.setAttribute('aria-invalid', 'true');
        problem = problem || { el: el, message: 'Numbers must be 0 or more.' };
      }
      if (isNew || value !== el.dataset.original.trim()) input[key] = value;
    });
    if (!$('#f-name').value.trim()) problem = { el: $('#f-name'), message: 'Give the part a name.' };
    if ($('#f-quantity').value.trim() === '') problem = problem || { el: $('#f-quantity'), message: 'Enter the quantity on hand (0 if there are none).' };
    if (problem) {
      problem.el.setAttribute('aria-invalid', 'true');
      showFormError(problem.message);
      problem.el.focus();
      return;
    }
    if (!isNew && !Object.keys(input).length) { $('#part-dialog').close(); return; }
    if (!isNew) input.id = state.editing;
    const save = $('#part-save');
    save.disabled = true;
    save.textContent = 'Saving…';
    api('apiSavePart', input)
      .then((res) => {
        $('#part-dialog').close();
        replacePart(res.part);
        if (isNew) {
          renderAll();
          const row = $('#list .row[data-id="' + CSS.escape(res.part.id) + '"]');
          if (row) { row.classList.add('flash'); row.scrollIntoView({ block: 'nearest' }); }
          toast('Added ' + displayName(res.part) + ' (' + res.part.id + ').', 'check');
        } else {
          renderAll();
          toast('Saved.', 'check');
        }
        announceAlert(res.alert);
      })
      .catch((err) => { if (!isAccessError(err)) showFormError(errorText(err)); })
      .then(() => { save.disabled = false; save.textContent = isNew ? 'Add part' : 'Save changes'; });
  }

  function showFormError(message) {
    const box = $('#part-form-error');
    clear(box).appendChild(icon('alert', 18));
    box.appendChild(document.createTextNode(message));
    box.hidden = false;
    box.scrollIntoView({ block: 'nearest' });
  }

  const ACTION_STYLE = {

  function showActivity() {

    if (!state.activity) renderActivity();

  function loadActivity() {
    const btn = $('#activity-refresh');
    btn.disabled = true;
    return api('apiGetActivity', { limit: state.activityLimit })
      .then((res) => { state.activity = res.entries; state.activityLoadedAt = Date.now(); renderActivity(); })

      for (let i = 0; i < 5; i++) list.appendChild(h('div', { class: 'skeleton' }, h('div', { class: 'bar', style: 'width:' + (40 + i * 9) + '%' }), h('div', { class: 'bar', style: 'width:24%' })));

    }

      el.appendChild(h('div', { class: 'card-list' }, h('div', { class: 'empty' },

  const REMINDERS = [['Off', 'Off'], ['Daily', 'Every day'], ['Weekdays', 'Weekdays (Mon–Fri)'], ['Weekly', 'Weekly (Mondays)']];

  function hourLabel(hour) {
    const d = new Date(2000, 0, 1, hour);
    return d.toLocaleTimeString(undefined, { hour: 'numeric' });
  }

  function renderSettings() {
    state.settingsDirty = false;
    const el = clear($('#settings'));
    const d = state.data;
    const s = d.settings;
    const owner = d.user.isOwner;
    const off = !owner;

    const recipients = h('textarea', { id: 's-recipients', rows: '2', disabled: off, spellcheck: 'false', placeholder: 'buyer@yourcompany.com, you@gmail.com' });
    recipients.value = s.recipients.join(', ');
    const alerts = h('input', { id: 's-alerts', type: 'checkbox', disabled: off, checked: s.alertsEnabled });
    const reminder = h('select', { id: 's-reminder', disabled: off }, REMINDERS.map((r) => h('option', { value: r[0], selected: r[0] === s.reminder }, r[1])));
    const hour = h('select', { id: 's-hour', disabled: off, 'aria-label': 'Reminder time' });

    syncHour();
    const appName = h('input', { id: 's-appname', maxlength: '60', disabled: off });
    appName.value = s.appName;

    code.value = s.accessCode;
    const appUrl = h('input', { id: 's-appurl', type: 'url', disabled: off, spellcheck: 'false', placeholder: 'Paste the web app link (ends in /exec)' });
    appUrl.value = s.appUrl;

      e.preventDefault();

    h('h2', {}, 'Low-stock emails'),
    h('p', { class: 'sub' }, owner ? 'Who gets told when parts run low, and when.' : 'Only ' + (d.info.sender || 'the person who set up the app') + ' can change these.'),
    h('div', { class: 'form-grid two' },
      h('div', { class: 'field span-2' }, h('label', { for: 's-recipients' }, 'Send alerts to'), recipients,
        h('span', { class: 'hint' }, 'Separate several addresses with commas. Any email address works, including Outlook.')),
      h('label', { class: 'switch span-2', for: 's-alerts' }, alerts, h('span', { class: 'track' }),
        h('span', { class: 'switch-text' }, h('b', {}, 'Email as soon as a part runs low'),
          h('span', { class: 'hint' }, 'One email per part when it drops to or below its alert level. It can email again after the part is restocked.'))),
      h('div', { class: 'field' }, h('label', { for: 's-reminder' }, 'Reminder of parts still low'), reminder),
      h('div', { class: 'field' }, h('label', { for: 's-hour' }, 'Reminder time'), hour),
      h('div', { class: 'field span-2' }, h('span', { class: 'hint' }, 'The reminder lists parts that are still low and not marked as ordered. Times use the spreadsheet\'s time zone (' + d.info.timeZone + ').'))),
    h('h2', { style: 'margin-top:22px' }, 'App'),
    h('p', { class: 'sub' }, 'How the app looks and who can open it.'),
    h('div', { class: 'form-grid two' },
      h('div', { class: 'field' }, h('label', { for: 's-appname' }, 'App name'), appName),
      h('div', { class: 'field' }, h('label', { for: 's-code' }, 'Access code'), code,
        h('span', { class: 'hint' }, 'Optional. People enter it once per device. Use one if anyone with the link can open the app.')),
      h('div', { class: 'field span-2' }, h('label', { for: 's-appurl' }, 'Web app link'), appUrl,
        h('span', { class: 'hint' }, 'Used for the "View in the app" links in emails. It\'s usually filled in when the app is first opened; if it\'s empty, paste the link from Deploy > Manage deployments.'))),
    h('div', { class: 'card-actions' }, saveBtn));
    const markDirty = () => { state.settingsDirty = true; };
    form.addEventListener('input', markDirty);
    form.addEventListener('change', markDirty);

    const facts = h('ul', { class: 'facts' },
      h('li', {}, icon('send', 16), h('span', {}, 'Emails are sent from ', h('b', {}, d.info.sender || 'the owner\'s Google account'), '.')),
      d.info.emailQuota !== null ? h('li', {}, icon('mail', 16), h('span', {}, d.info.emailQuota + ' emails left today (Google\'s daily limit).')) : null,
      h('li', {}, icon('clock', 16), h('span', {}, d.info.alertsInstalled
        ? 'Automatic check every hour' + (d.info.lastCheck ? ', last one ' + timeAgo(d.info.lastCheck) : '') + '.'
        : 'Automatic checks are off. In the spreadsheet, choose Inventory > Set up / repair.')),
      d.info.lastAlertError ? h('li', {}, icon('alert', 16), h('span', {}, 'Last problem: ' + d.info.lastAlertError.message + ' (' + timeAgo(d.info.lastAlertError.at) + ')')) : null);

      owner ? h('div', { class: 'card-actions', style: 'margin-top:0' }, testBtn, remindBtn) : null,

    nameInput.value = state.actor;
    nameInput.addEventListener('change', () => { setActor(nameInput.value); toast('Saved on this device.', 'check'); });
    el.appendChild(h('section', { class: 'card' },
      h('h2', {}, 'You'),
      h('p', { class: 'sub' }, d.user.email ? 'You\'re signed in as ' + d.user.email + '. Changes are logged under that address.' : 'Google doesn\'t tell the app who you are, so changes are logged under this name. It\'s saved on this device.'),
      d.user.email ? null : h('div', { class: 'field' }, h('label', { for: 's-name' }, 'Your name'), nameInput),
      state.code && !owner ? h('div', { class: 'card-actions' }, h('button', { class: 'btn', type: 'button', onclick: forgetCode }, icon('lock', 16), 'Forget the access code on this device')) : null));

    el.appendChild(h('section', { class: 'card' },
      h('h2', {}, 'Spreadsheet'),
      h('p', { class: 'sub' }, 'Everything is stored in the Google Sheet "' + d.info.spreadsheetName + '": the Inventory, Settings and Activity Log tabs. Edits there show up here after a refresh.'),
      h('div', { class: 'card-actions', style: 'margin-top:0' },

        h('span', { class: 'muted' }, 'Version ' + d.version))));

  function sendEmail(fn, button) {

  function setActor(name) {
    state.actor = String(name || '').trim().slice(0, 60);

  // -------------------------------------------------------------------------
  // Toasts and small dialogs
  // -------------------------------------------------------------------------

  /** action (optional) = { label, run } shows a button in the toast. */
  function toast(message, kind, action) {
    const box = $('#toasts');
    const el = h('div', { class: 'toast' + (kind === 'error' ? ' error' : ''), role: kind === 'error' ? 'alert' : 'status' },
      icon(kind === 'error' ? 'alert' : ICONS[kind] ? kind : 'info', 18),
      h('div', { class: 'grow' }, message),
      action ? h('button', { class: 'toast-action', type: 'button', onclick: () => { dismiss(); action.run(); } }, action.label) : null,
      h('button', { type: 'button', 'aria-label': 'Dismiss', onclick: () => dismiss() }, icon('x', 16)));
    const dismiss = () => { el.classList.add('leaving'); setTimeout(() => el.remove(), 200); };
    box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(dismiss, action ? 12000 : kind === 'error' ? 9000 : 4500);
  }

  function confirmDialog(opts) {
    const dialog = $('#confirm-dialog');
    $('#confirm-title').textContent = opts.title;
    $('#confirm-message').textContent = opts.message;
    const ok = $('#confirm-ok');
    ok.textContent = opts.ok || 'OK';
    ok.className = 'btn ' + (opts.danger ? 'danger-fill' : 'primary');
    openDialog(dialog);
    return new Promise((resolve) => {
      const done = (value) => {
        ok.onclick = null;
        $('#confirm-cancel').onclick = null;
        dialog.onclose = null;
        if (dialog.open) dialog.close();
        resolve(value);
      };
      ok.onclick = () => done(true);
      $('#confirm-cancel').onclick = () => done(false);
      dialog.onclose = () => done(false);
    });
  }

  function askName() {
    const dialog = $('#name-dialog');
    $('#name-input').value = state.actor;
    openDialog(dialog);
    focusLater('#name-input', true);
  }

  // A phone's back button should close the part panel or form on top, not
  // leave the app, so opening one adds a history entry and closing removes it.
  let closingFromBack = false;
  let ownBackPending = 0;

  function pushBackStop(kind) {
    try { history.pushState({ partsInventory: kind }, ''); } catch (err) { /* history not available here */ }
  }

  function popBackStop(kind) {
    try {
      if (history.state && history.state.partsInventory === kind) {
        ownBackPending++;
        history.back();
      }
    } catch (err) { /* history not available here */ }
  }

  function openDialog(dialog) {
    dialog.showModal();
    pushBackStop('dialog');
  }

  function onBack() {
    // Our own history.back() after closing something isn't the back button.
    if (ownBackPending > 0) { ownBackPending--; return; }
    const dialog = $('dialog[open]');
    closingFromBack = true;
    if (dialog) dialog.close();
    else if (state.selectedId) closeDrawer(true);
    closingFromBack = false;
  }

  function focusLater(sel, select) {
    setTimeout(() => {
      const el = $(sel);
      if (!el) return;
      el.focus();
      if (select && el.select) el.select();
    }, 30);
  }

  // -------------------------------------------------------------------------
  // Views, filters and full-screen states
  // -------------------------------------------------------------------------

  function setView(view) {
    state.view = view;
    $$('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.getAttribute('data-view') === view)));
    ['inventory', 'activity', 'settings'].forEach((v) => { $('#view-' + v).hidden = v !== view; });
    $('#add-btn').hidden = view !== 'inventory';
    $('#fab-add').hidden = view !== 'inventory';
    if (view === 'settings') renderSettings();
    if (view === 'activity') showActivity();
    window.scrollTo(0, 0);
  }

  function setFilter(filter) {
    state.filter = filter;
    state.showCount = 150;
    renderFilters();
    renderList();
  }

  function resetFilters() {
    state.filter = 'all';
    state.search = '';
    state.category = '';
    $('#search').value = '';
    renderCategoryFilter();
    renderFilters();
    renderList();
  }

  /** Shows the access code screen. message is the server's reason, shown only when a code was tried. */
  function showLock(message, lockedOut) {
    const screen = clear($('#screen'));
    $('#app').hidden = true;
    closeDrawer();
    const input = h('input', { id: 'code-input', type: 'password', autocomplete: 'current-password', 'aria-label': 'Access code', placeholder: 'Access code', required: true });
    const error = h('div', { class: 'error-text', role: 'alert' });
    const btn = h('button', { class: 'btn primary block', type: 'submit' }, 'Open');
    screen.appendChild(h('div', { class: 'screen-card' },
      h('div', { class: 'logo' }, icon('lock', 24)),
      h('h1', {}, (state.data && state.data.settings.appName) || BOOT.appName || 'Parts Inventory'),
      h('p', {}, 'Enter the access code to open the inventory. You only need to do this once on this device.'),
      h('form', { onsubmit: (e) => {
        e.preventDefault();
        state.code = input.value.trim();
        if (!state.code) return;
        btn.disabled = true;
        error.textContent = '';
        load({ fromLock: true }).then(() => { btn.disabled = false; openDeepLink(); });
      } }, input, error, btn)));
    screen.hidden = false;
    if (message && state.code) {
      error.textContent = message;
      if (lockedOut) {
        // Too many wrong tries by someone: this code may be fine, so keep it for later.
        input.value = state.code;
      } else {
        // This code was turned down: forget it.
        state.code = '';
        store.set('code', '');
      }
    }
    setTimeout(() => input.focus(), 30);
  }

  function showFatal(message) {
    const screen = clear($('#screen'));
    $('#app').hidden = true;
    screen.appendChild(h('div', { class: 'screen-card' },
      h('div', { class: 'logo' }, icon('alert', 24)),
      h('h1', {}, 'Couldn\'t open the inventory'),
      h('p', {}, 'If this is a new setup, open the spreadsheet and choose Inventory > Set up / repair, then try again.'),
      h('pre', {}, message),
      h('button', { class: 'btn primary block', type: 'button', onclick: () => { screen.hidden = true; showLoading(); load(); } }, 'Try again')));
    screen.hidden = false;
  }

  function showLoading() {
    $('#app').hidden = false;
    const list = clear($('#list'));
    for (let i = 0; i < 6; i++) {
      list.appendChild(h('div', { class: 'skeleton' }, h('div', { class: 'bar', style: 'width:' + (30 + ((i * 17) % 40)) + '%' }), h('div', { class: 'bar', style: 'width:18%' })));
    }
  }

  // -------------------------------------------------------------------------
  // Start up
  // -------------------------------------------------------------------------

  function wire() {
    $$('[data-icon]').forEach((el) => el.insertBefore(icon(el.getAttribute('data-icon'), el.classList.contains('logo') ? 18 : 18), el.firstChild));
    $$('.tab').forEach((t) => t.addEventListener('click', () => setView(t.getAttribute('data-view'))));
    $('#refresh-btn').addEventListener('click', () => { flushAll(); load(); if (state.view === 'activity') loadActivity(); });
    $('#add-btn').addEventListener('click', () => openPartForm(null));
    $('#fab-add').addEventListener('click', () => openPartForm(null));
    $('#activity-refresh').addEventListener('click', loadActivity);
    let searchTimer = null;
    $('#search').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { state.search = e.target.value; state.showCount = 150; renderList(); }, 120);
    });
    $('#category-filter').addEventListener('change', (e) => { state.category = e.target.value; renderList(); });
    $('#sort').addEventListener('change', (e) => { state.sort = e.target.value; store.set('sort', state.sort); renderList(); });
    $('[data-close-drawer]').addEventListener('click', closeDrawer);
    $('#part-form').addEventListener('submit', submitPartForm);
    $('#f-partNumber').addEventListener('input', checkDuplicate);
    $$('[data-close-dialog]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));
    $('#name-form').addEventListener('submit', (e) => {
      e.preventDefault();
      setActor($('#name-input').value);
      $('#name-dialog').close();
      if (state.actor) toast('Thanks, ' + state.actor + '.', 'check');
    });
    $('#name-skip').addEventListener('click', () => { state.dismissed.name = true; $('#name-dialog').close(); renderBanners(); });

    document.addEventListener('keydown', (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
      if (e.key === 'Escape' && state.selectedId && !$('dialog[open]')) { closeDrawer(); return; }
      if (e.key === '/' && !typing && state.view === 'inventory' && !$('dialog[open]') && !state.selectedId) {
        e.preventDefault();
        $('#search').focus();
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { flushAll(); return; }
      if (state.data && Date.now() - state.loadedAt > 60000 && !busy()) load();
    });
    window.addEventListener('pagehide', flushAll);
    window.addEventListener('popstate', onBack);
    $$('dialog').forEach((d) => d.addEventListener('close', () => { if (!closingFromBack) popBackStop('dialog'); }));
    setInterval(() => {
      if (document.visibilityState === 'visible' && state.data && !busy() && Date.now() - state.loadedAt > 5 * 60000) load();
    }, 60000);
  }

  /** True while someone is in the middle of something a background refresh would disturb. */
  function busy() {
    return !!$('dialog[open]') || !!state.selectedId || state.settingsDirty ||
      Object.keys(state.pending).length > 0 || Object.keys(state.inflight).length > 0;
  }

  function start() {
    wire();
    if (BOOT.mode === 'sidebar') document.body.classList.add('is-sidebar');
    if (BOOT.error) { showFatal(BOOT.error); return; }
    if (BOOT.locked && !BOOT.data) {
      if (state.code) { showLoading(); load({ fromLock: true }).then(openDeepLink); } else showLock();
      return;
    }
    if (BOOT.data) { applyData(BOOT.data); openDeepLink(); return; }
    showLoading();
    load().then(openDeepLink);
  }

  function openDeepLink() {
    if (!BOOT.part || !state.data) return;
    const wanted = String(BOOT.part).trim();
    BOOT.part = '';
    const part = state.parts.find((p) => p.id.toUpperCase() === wanted.toUpperCase());
    if (part) openPart(part.id);
    else toast('Part ' + wanted + ' wasn\'t found. It may have been deleted.', 'error');
  }

  start();
})();
</script>
</body>
</html>
